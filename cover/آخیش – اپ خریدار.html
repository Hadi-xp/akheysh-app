<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آخیش</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4f2a6e;--p2:#7a45a8;--soft:#efe8f5;--b:#ecdfd2;--bg:#f7f3ef;--card:#fff;--ink:#1c2250;--mut:#6b6880;--line:#e6dfe9;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17131d;--card:#221c2b;--ink:#f0eaf7;--mut:#a79fb8;--line:#392f47;--soft:#2e2440;--b:#3a2f2a}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.7 Vazirmatn,Tahoma,sans-serif}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;background:var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding:14px}
nav{flex:none;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);text-decoration:none;gap:0}
nav a i{font-style:normal;font-size:20px;line-height:1.3}
nav a.on{color:var(--p)}nav a.me.on i{background:var(--p);color:#fff;border-radius:12px;padding:2px 10px}
h1{font-size:17px;font-weight:700}h3{font-size:15px;font-weight:700;margin-bottom:6px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .t{flex:1}.top small{display:block;color:var(--mut);font-size:12px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--b);border:0}
.btn{display:block;width:100%;border:1px solid var(--p);background:var(--p);color:#fff;border-radius:12px;padding:11px;font:700 14px Vazirmatn;text-align:center;cursor:pointer;text-decoration:none;margin-top:8px}
.btn.o{background:transparent;color:var(--p)}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;background:var(--soft);color:var(--p2);border-radius:20px;padding:0 10px;font-size:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;color:var(--mut);margin:2px}
.mut{color:var(--mut);font-size:12px}.big{font-size:20px;font-weight:700}
.list a{display:flex;align-items:center;gap:12px;padding:11px 4px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.list a:last-child{border:0}.list b{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:400}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs a{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--card);color:var(--ink);text-decoration:none;font-size:12px}.tabs a.on{background:var(--p);color:#fff}
.otp{display:flex;gap:6px;direction:ltr;margin:12px 0}.otp input{text-align:center;padding:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img{height:90px;border-radius:10px;background:linear-gradient(135deg,var(--soft),var(--b));display:grid;place-items:center;font-size:34px;margin-bottom:6px}
.stat{background:var(--bg);border-radius:12px;text-align:center;padding:8px;flex:1}.stat b{display:block;font-size:18px}
.steps{display:flex;justify-content:space-between;text-align:center;font-size:12px}.steps span{display:block;width:34px;height:34px;border-radius:50%;background:var(--soft);margin:0 auto 4px;line-height:34px}.steps .d span{background:var(--p);color:#fff}
.home{background:linear-gradient(160deg,#3a1c58,#5b2f87);color:#fff;border-radius:0;margin:-14px;padding:20px;min-height:calc(100% + 28px);display:flex;flex-direction:column}
.home .s{background:#fff;color:#333;border-radius:40px;padding:16px 22px;text-decoration:none;margin-top:auto;margin-bottom:auto}
.blob{font-size:90px;text-align:center;margin-top:40px;filter:drop-shadow(0 0 18px #b57cf0)}
summary{cursor:pointer;font-weight:700;padding:6px 0}
@media(prefers-reduced-motion:no-preference){main>*{animation:in .2s}@keyframes in{from{opacity:.4}}}
</style>
</head>
<body>
<div id="app"><main id="v"></main><nav id="nav"></nav></div>
<script>
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace(/\B(?=(\d{3})+(?!\d))/g,',').replace(/(?<=[۰-۹]),(?=[۰-۹])/g,',');
const T=n=>fa(n).replace(/,/g,'٬')+' تومان';
const P={name:'کولر گازی اسپلیت دیواری',model:'GWS-H30P1T1A'};
const S=[{n:'خانه کالا',p:73229000,r:'۴.۷',c:'۲٬۷۲۱',g:0,sh:'۲۵۰٬۰۰۰ تومان',d:'۱ روز کاری'},{n:'لوازم خانگی آشتیانی',p:76119600,r:'۳.۵',c:'۲٬۴۲۰',g:1,sh:'رایگان',d:'۱ تا ۲ روز کاری'},{n:'خانه هوشا',p:101119600,r:'۲.۷',c:'۱٬۱۱۰',g:0,sh:'رایگان',d:'۱ روز کاری'}];
const back=t=>`<div class="top"><button class="back" onclick="history.back()" aria-label="بازگشت">→</button><h1 class="t">${t}</h1></div>`;
const sub=(t,i)=>`<div class="top"><button class="back" onclick="history.back()" aria-label="بازگشت">→</button><div class="t"><h1>${t}</h1><small>پنل سارا آشتیانی</small></div><b class="tag">${i}</b></div>`;
const hero=(t,s)=>`<div class="card hero"><h3>${t}</h3><span class="mut">${s}</span></div>`;
const menu=a=>`<div class="card list">${a.map(([i,t,h])=>`<a href="#${h}"><b>${i}</b>${t}</a>`).join('')}</div>`;
const fld=(l,v,ph='')=>`<label>${l}</label><input value="${v}" placeholder="${ph}">`;
const R={
home:()=>`<div class="home"><div style="text-align:end"><a href="#account" style="color:#fff;font-size:28px;text-decoration:none">👤</a></div><div class="blob">🫧</div><div class="row" style="padding:0 6px"><b>تا لحظه گفتن</b><b>کنار شما هستیم</b></div><h1 style="text-align:center;font-size:34px;color:#c99bf0">آخیش</h1><a class="s" href="#search">🔍 جستجوی محصول..........</a></div>`,
login:()=>`<div class="card" style="margin-top:20%"><h1 style="color:var(--p);font-size:28px;text-align:center">آخیش</h1><h3>ورود</h3><span class="mut">کد ارسال‌شده را وارد کنید</span><div class="otp">${'000000'.split('').map(()=>'<input maxlength=1 inputmode=numeric value=0>').join('')}</div><a class="btn" href="#home">ورود</a><p class="mut" style="text-align:center;margin-top:8px">ارسال مجدد کد یکبار مصرف (۶۰)</p></div>`,
search:()=>`${back('جستجو')}<input value="کولر" aria-label="جستجو"><div class="row" style="margin:14px 0 6px"><h3>جستجوهای اخیر</h3><a href="#search" class="mut">پاک کردن همه</a></div><div class="card list">${['کولر گازی','بخاری برقی','کولر آبی'].map(x=>`<a href="#product">🕘 ${x}</a>`).join('')}</div><h3>جستجوهای پرطرفدار</h3><p>${['کولر گازی','بخاری برقی','پکیج','آبگرمکن'].map(x=>`<a class="chip" href="#product">${x}</a>`).join('')}</p><h3 style="margin-top:12px">پیشنهادات</h3><div class="card list">${['کولر گازی اینورتر','کولر گازی ۲۴۰۰۰','کولر گازی ۳۰۰۰۰'].map(x=>`<a href="#product">${x}</a>`).join('')}</div>`,
product:()=>`${back('جزئیات محصول')}<div class="card"><div class="img" style="height:160px;font-size:70px">❄️</div><h1>کولر گازی اسپلیت دیواری اینورتر گرین مدل ۳۰۰۰۰</h1><div class="row" style="margin-top:8px"><span class="mut">${P.model}</span><span class="tag">برند: گرین</span></div></div><div class="card"><label>رنگ محصول</label><span class="tag">سفید</span><label>تعداد</label><div class="row" style="justify-content:flex-start"><button class="back" onclick="q(1)" aria-label="افزودن">+</button><b id="q" style="width:40px;text-align:center">۱</b><button class="back" onclick="q(-1)" aria-label="کاهش">−</button></div><label>توضیحات بیشتر برای فروشنده (اختیاری)</label><textarea rows="4" placeholder="اگر درباره رنگ، شرایط نصب یا نحوه ارسال توضیحی دارید، اینجا بنویسید."></textarea></div><a class="btn" href="#status">درخواست فروشنده</a>`,
status:()=>`${back('وضعیت درخواست خرید')}${hero('در حال یافتن بهترین پیشنهادها','درخواست شما برای فروشندگان ارسال شد و ما در حال جست‌وجوی بهترین پیشنهادات هستیم.')}<div class="card"><h3>مراحل درخواست</h3><div class="steps"><div class="d"><span>✓</span>درخواست ارسال شد<br><small class="mut">۲ دقیقه پیش</small></div><div class="d"><span>🔍</span>در انتظار پاسخ فروشندگان</div><div><span>👥</span>دریافت پیشنهادات</div></div></div><div class="card"><div class="row"><h3>پیشنهادهای دریافتی</h3><span class="tag">۳ پیشنهاد</span></div><p class="mut">۳ فروشنده به درخواست خرید شما پیشنهاد داده‌اند.</p><a class="btn" href="#offers">مشاهده ۳ پیشنهاد</a></div><a class="btn o" href="#home">لغو درخواست</a>`,
offers:()=>`${back('درخواست‌های خریدار')}<div class="card"><span class="tag">${P.name}</span> <span class="mut">${P.model}</span><h3 style="margin-top:6px">${P.name}</h3><span class="mut">۳۰۰۰۰ بی تی یو • کمپرسور روتاری • اینورتر A</span></div><div class="row" style="margin-bottom:8px"><h3>پیشنهادهای فروشندگان</h3><span class="tag">۳ پیشنهاد</span></div>${S.map((s,i)=>`<div class="card"><div class="row"><div><span class="mut">قیمت</span><div class="big">${T(s.p)}</div></div><div style="text-align:end"><b>${s.n}</b><br><span class="mut">${s.c} نظر • ${s.r} امتیاز</span></div></div><p><span class="chip">گارانتی: ${s.g?'دارد':'ندارد'}</span><span class="chip">ارسال: ${s.sh}</span><span class="chip">زمان تحویل: ${s.d}</span></p><div class="row"><span class="tag">🛡 فروشنده تاییدشده</span><a class="btn" style="width:auto;margin:0;padding:8px 14px" href="#seller">مشاهده جزئیات</a></div></div>`).join('')}`,
seller:()=>{const s=S[2];return `<div class="top"><button class="back" onclick="history.back()" aria-label="بازگشت">→</button><h1 class="t">جزئیات فروشنده</h1><b style="color:var(--p)">آخیش</b></div><div class="card"><span class="mut" style="color:var(--p2)">فروشنده انتخابی</span><h1>${s.n}</h1><span class="mut">${s.r} از ۵ • ${s.c} نظر</span><div class="row" style="margin:10px 0">${[['۱۳۲','سفارش موفق'],['۲۰۰','سفارش ناموفق'],['۵۵','تحویل به‌موقع']].map(x=>`<div class="stat"><b>${x[0]}</b><small class="mut">${x[1]}</small></div>`).join('')}</div><p class="mut">خدمات اعلام‌شده: 🎧 پشتیبانی پاسخگو • 🚚 ارسال سریع • 🛡 ضمانت اصالت کالا</p></div><div class="card"><h3>${P.name}</h3><span class="mut">${P.model}</span><p><span class="chip">ظرفیت ۳۰۰۰۰</span><span class="chip">اینورتر / گرید A</span><span class="chip">سفید</span><span class="chip">کمپرسور روتاری</span></p></div><div class="card"><h3>خرید از ${s.n}</h3><span class="mut">قیمت نهایی</span><div class="big">${T(s.p)}</div><div class="card" style="background:var(--soft);margin-top:10px"><b>🚚 زمان تحویل</b><br>۱ روز کاری پس از ارسال توسط پست</div><div class="row mut"><span>هزینه ارسال: رایگان</span><span>گارانتی: ندارد</span></div><a class="btn" href="#receipt">خرید از فروشنده</a><a class="btn o" href="#support">ارسال پیام به فروشنده</a><a class="btn o" style="border:0" href="#offers">بازگشت به لیست فروشندگان</a></div><div class="card"><h3>درباره فروشگاه</h3>فروشگاه خانه هوشا با بیش از ۱۵ سال سابقه فعالیت در زمینه فروش لوازم خانگی، به‌ویژه محصولات سرمایشی و گرمایشی، با تضمین اصالت کالا، سرعت ارسال و پشتیبانی حرفه‌ای آماده خدمت‌رسانی به شما عزیزان است.</div><div class="card"><h3>نظرات کاربران</h3>${[['سارا آشتیانی','۱۴۰۵/۰۷/۱۸','ممنونم از فروشگاه خانه هوشا زمان تحویل به موقع بود.'],['علیرضا آشتیانی','۱۴۰۵/۰۷/۱۵','همه چی خوب بود فقط رفتار پستچی خیلی بد بود.']].map(r=>`<div class="card" style="background:var(--bg)"><b>${r[0]}</b> <span class="mut">${r[1]}</span><div style="color:#b8860b">★★★★☆</div>${r[2]}</div>`).join('')}</div>`},
receipt:()=>`${back('رسید خرید')}<div class="card"><h1 style="color:var(--ok)">✓ پرداخت موفق</h1><span class="mut">سفارش شما با موفقیت ثبت شد و در حال پردازش است.</span></div><div class="card"><h3>خلاصه سفارش</h3>${[['مبلغ پرداخت شده',T(101119600)],['شماره فاکتور','۱۴۰۵۱۲۰۰'],['تاریخ سفارش','۱۴۰۵/۰۷/۲۰'],['وضعیت','در حال پردازش']].map(x=>`<div class="row"><span class="mut">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card"><h3>اطلاعات محصول</h3><b>${P.name}</b><br><span class="mut">مدل ${P.model} • فروشنده: خانه هوشا</span><div class="big">${T(101119600)}</div></div><div class="card"><h3>اطلاعات تحویل</h3>📍 خیابان قصرالدشت، کوچه فرامرزی، پلاک ۱۱<br>💳 درگاه پرداخت آنلاین رمز پویا</div><div class="grid"><a class="btn o" href="#receipt">پرینت فاکتور</a><a class="btn o" href="#receipt">دانلود فاکتور</a></div><a class="btn" href="#home">🏠 بازگشت به صفحه اصلی</a>`,
account:()=>`<div class="top"><button class="back" onclick="history.back()" aria-label="بازگشت">→</button><div class="t"><h1>حساب من</h1><small>پنل سارا آشتیانی</small></div></div><div class="card hero"><span class="mut">حساب کاربری خریدار</span><h1>سارا آشتیانی</h1></div>${menu([['✎','ویرایش حساب','edit'],['🛍','سفارش‌های من','orders'],['📄','قوانین و مقررات','terms'],['💬','انتقادات و پیشنهادات','feedback']])}${menu([['💳','کیف پول و پرداخت‌ها','wallet'],['📍','نشانی‌ها','addresses'],['♡','علاقمندی‌ها','favs']])}${menu([['?','پشتیبانی و راهنمایی','support'],['⎋','خروج از حساب','logout']])}`,
edit:()=>`${back('ویرایش حساب')}<div class="card hero"><span class="mut">حساب کاربری خریدار</span><h1>سارا آشتیانی</h1></div><div class="card"><h3>اطلاعات شخصی</h3>${fld('نام و نام خانوادگی','سارا آشتیانی')}${fld('شماره موبایل','۰۹۱۲ ۳۴۵ ۶۷۸۹')}${fld('ایمیل','sara.ashtiani@gmail.com')}</div><p class="mut">🛡 اطلاعات شما فقط برای خرید و پیگیری سفارش‌هاست.</p><a class="btn" href="#account">ذخیره تغییرات</a>`,
orders:()=>`${sub('سفارش‌های من','🛍')}<div class="tabs"><a class="on">همه</a><a>جاری</a><a>تحویل‌شده</a><a>لغو و مرجوعی</a></div><p class="mut">۴ سفارش ثبت‌شده • جدیدترین سفارش‌ها</p>${[['#B33C056','در مسیر ارسال','۱۴۰۵/۰۸/۱۰','۲ کالا',86040000,'پیگیری سفارش'],['#B66TU95','تحویل‌شده','۱۴۰۵/۰۸/۰۳','۱ کالا',34111100,'ثبت نظر برای کالا']].map(o=>`<div class="card"><div class="row"><span class="tag">${o[1]}</span><div><span class="mut">کد سفارش</span><br><b dir="ltr">${o[0].slice(0,5)}</b></div></div><p class="mut">${o[2]}</p><b>${o[3]}</b> <b>${T(o[4])}</b><div class="row"><a class="btn" style="width:auto;padding:6px 14px" href="#receipt">مشاهده جزئیات</a><span class="mut">${o[5]}</span></div></div>`).join('')}<a class="mut" href="#orders">مشاهده سفارش‌های قدیمی‌تر ‹</a>`,
wallet:()=>`${sub('کیف پول و پرداخت‌ها','💳')}<div class="card hero"><span class="mut">موجودی قابل استفاده</span><div class="big" style="font-size:28px">${T(1250000)}</div><a class="btn" href="#wallet">＋ افزایش موجودی</a></div><div class="row"><h3>تاریخچه تراکنش‌ها</h3><span class="mut">آبان ۱۴۰۵</span></div><div class="card">${[['بازگشت وجه سفارش','۸ آبان ۱۴۰۵ • سفارش B66TU95','+۳۵۰٬۰۰۰',1],['پرداخت سفارش','۶ آبان ۱۴۰۵ • سفارش B33C056','−۸۵۰٬۰۰۰',0],['افزایش موجودی','۶ آبان ۱۴۰۵ • پرداخت بانکی','+۱٬۰۰۰٬۰۰۰',1],['پرداخت سفارش','۲ آبان ۱۴۰۵ • سفارش B1362V9','−۲۵۰٬۰۰۰',0]].map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${x[0]}</b><br><span class="mut">${x[1]}</span></div><div style="text-align:end;color:${x[3]?'var(--ok)':'inherit'}"><b>${x[2]}</b><br><span class="mut">تومان • موفق</span></div></div>`).join('')}</div>`,

support:()=>`${sub('پشتیبانی و راهنمایی','?')}${hero('سارا جان، چطور کمک کنیم؟','از پیگیری سفارش تا راهنمایی خرید، کنار شما هستیم.')}<h3>پرسش‌های پرتکرار</h3><div class="card">${[['چطور سفارشم را پیگیری کنم؟','در «سفارش‌های من»، سفارش را انتخاب کنید و روی «پیگیری سفارش» بزنید تا آخرین وضعیت ارسال را ببینید.'],['چطور درخواست مرجوعی ثبت کنم؟','از جزئیات سفارش، گزینه مرجوعی را انتخاب کنید.'],['پرداخت ناموفق را چطور پیگیری کنم؟','مبلغ کسرشده تا ۷۲ ساعت به حساب شما بازمی‌گردد.'],['می‌توانم نشانی سفارش را تغییر دهم؟','تا قبل از ارسال، از بخش جزئیات سفارش.']].map((q,i)=>`<details ${i?'':'open'}><summary>${q[0]}</summary><p class="mut">${q[1]}</p></details>`).join('')}</div><a class="btn" href="#support">🎧 گفت‌وگو با پشتیبانی</a><div class="grid"><a class="btn o" href="#support">📞 درخواست تماس</a><a class="btn o" href="#support">💬 درخواست‌های من</a></div>`,
feedback:()=>`${sub('انتقادات و پیشنهادات','💬')}${hero('آخیش، با نظر شما بهتر می‌شود','از تجربه خریدتان بگویید؛ پیشنهادهای شما را می‌خوانیم و پیگیری می‌کنیم.')}<div class="card"><label>نوع بازخورد</label><div class="tabs"><a class="on">پیشنهاد ✓</a><a>انتقاد</a></div>${fld('موضوع','تجربه خرید و پیگیری سفارش')}<label>متن پیام</label><textarea rows="5" maxlength="1000">پیشنهاد می‌کنم امکان انتخاب بازه زمانی دریافت سفارش هم اضافه شود تا بتوانم خریدهایم را راحت‌تر تحویل بگیرم.</textarea><p class="mut">حداکثر ۱۰۰۰ نویسه</p><label style="font-weight:400"><input type="checkbox" checked style="width:auto"> مایلم پاسخ را در حساب سارا آشتیانی دریافت کنم.</label></div><a class="btn" href="#account">ارسال بازخورد</a>`,
terms:()=>`${sub('قوانین و مقررات','📄')}${hero('با آگاهی، آسوده خرید کنید','این متن، نمونه‌ای توضیحی برای طراحی است و نسخه نهایی شرایط حقوقی آخیش نیست.')}<div class="card">${[['حساب کاربری و اطلاعات شما','برای ثبت خرید، اطلاعات تماس و نشانی خود را دقیق وارد کنید. رمز عبور و کد ورود را در اختیار دیگران نگذارید.'],['ثبت سفارش و پرداخت','پیش از پرداخت، مشخصات کالا، تعداد، قیمت نهایی و نشانی ارسال را بررسی کنید.'],['ارسال و دریافت کالا','بازه و هزینه ارسال در مرحله نهایی خرید نمایش داده می‌شود. هنگام دریافت، بسته و کالای داخل آن را بررسی کنید.'],['لغو سفارش و درخواست مرجوعی','امکان لغو یا مرجوعی به وضعیت سفارش و شرایط همان کالا بستگی دارد.'],['حریم خصوصی و ارتباط با ما','اطلاعات حساب برای انجام خرید، ارسال و پشتیبانی استفاده می‌شود.']].map((t,i)=>`<h3>${fa(i+1)}. ${t[0]}</h3><p style="margin-bottom:10px">${t[1]}</p>`).join('')}</div><p class="mut" style="text-align:center">نسخه نمایشی • ویژه حساب خریدار</p>`,
logout:()=>`<div class="card" style="margin-top:30%;text-align:center"><h3>خروج از حساب</h3><p class="mut">مطمئنید که می‌خواهید از حساب خود خارج شوید؟</p><a class="btn" href="#login">خروج</a><a class="btn o" href="#account">انصراف</a></div>`};
const N=[['home','🏠','خانه'],['cats','▦','دسته بندی'],['cart','🛒','سبد خرید'],['support','🎧','پشتیبانی'],['account','👤','',' me']];
const acc='edit orders wallet addresses addaddr favs feedback terms logout account'.split(' ');
function go(){const h=(location.hash||'#home').slice(1),r=R[h]||R.home;v.innerHTML=r();v.scrollTop=0;
nav.style.display=h=='login'?'none':'';
nav.innerHTML=N.map(([k,i,t,c])=>`<a class="${c?'me':''} ${(k==h||(k=='account'&&acc.includes(h))||(k=='home'&&['search','product','status','offers','seller','receipt'].includes(h)))?'on':''}" href="#${R[k]?k:'home'}"><i>${i}</i>${t}</a>`).join('')}
function q(d){const e=document.getElementById('q');const n=Math.max(1,(+e.dataset.n||1)+d);e.dataset.n=n;e.textContent=fa(n)}
addEventListener('hashchange',go);go();
</script>
